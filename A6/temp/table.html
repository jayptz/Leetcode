{% extends "base.html" %}
{% block content %}
<h3>{{ title }}</h3>
<p class="text-muted">{{ description }}</p>

<h6>SQL</h6>
<pre class="bg-light p-2 border rounded small">{{ code }}</pre>

<h6 class="mt-3">Result</h6>
<table class="table table-bordered table-striped table-sm">
  <thead>
    <tr>
      {% for c in cols %}
        <th>{{ c }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for r in rows %}
      <tr>
        {% for v in r %}
          <td>{{ v }}</td>
        {% endfor %}
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
